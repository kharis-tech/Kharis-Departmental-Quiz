  <style>
    * { box-sizing: border-box; transition: all .25s ease; }
    html, body { height: 100%; margin: 0; }
    
    body {
      font-family: 'Quicksand', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      --bg-img: url('https://kharis.org/wp-content/uploads/2022/11/271239127_4868436629869265_1030465267411614205_n.jpg');
      --card-bg: rgba(60,19,97,0.85);
      --btn-bg: #ffd700;
      --btn-color: #3c1361;
      --text-color: #fff;
      background: var(--bg-img) center/cover no-repeat fixed;
      color: var(--text-color);
    }
    
    body.light {
      --card-bg: rgba(255,255,255,0.95);
      --btn-bg: #3c1361;
      --btn-color: #ffd700;
      --text-color: #111;
      background: linear-gradient(180deg,#fff,#f4f4f4);
    }
    
    .card {
      width: 100%;
      max-width: 820px;
      background: var(--card-bg);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      color: var(--text-color);
      position: relative;
    }
    
    h1 { font-family: 'Fredoka One', cursive; margin-bottom: 0.6rem; }
    p.lead { margin-bottom: 1rem; opacity: 0.9; }
    
    .btn {
      display: inline-block;
      width: 100%;
      max-width: 360px;
      margin: 0.6rem auto;
      padding: 12px 18px;
      border-radius: 50px;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-color);
      font-family: 'Fredoka One', cursive;
      cursor: pointer;
      font-size: 1rem;
    }
    
    .btn:hover { filter: brightness(.92); transform: scale(1.02); }
    
    input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 30px;
      border: none;
      font-size: 1rem;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.9);
      color: #3c1361;
      text-align: center;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.15);
    }
    
    /* Bubbly Dropdown Styles */
    .language-dropdown-container {
      position: relative;
      display: inline-block;
      margin: 0 auto 20px auto;
      text-align: center;
      z-index: 1000;
    }
    
body.light .language-select {
  color: #3c1361;
  background: rgba(255, 255, 255, 0.8);
}

body.light .language-select option {
  background: rgba(255, 255, 255, 0.95);
  color: #3c1361;
}

body.light .language-dropdown-container::after {
  color: #3c1361;
}


    .language-select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 215, 0, 0.7);
      border-radius: 25px;
      padding: 12px 45px 12px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      width: 200px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      outline: none;
    }
    
    .language-select:hover {
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      transform: translateY(-2px);
    }
    
    .language-select:focus {
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.5);
    }
    
    .language-dropdown-container::after {
      content: "▼";
      font-size: 12px;
      color: #ffd700;
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }
    
    .language-select option {
      background: rgba(60, 19, 97, 0.95);
      color: #fff;
      padding: 10px;
      border-radius: 15px;
      margin: 5px;
      font-weight: bold;
    }
    
    .language-select::-webkit-scrollbar {
      width: 8px;
    }
    
    .language-select::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    
    .language-select::-webkit-scrollbar-thumb {
      background: rgba(255, 215, 0, 0.7);
      border-radius: 10px;
    }
    
    .language-select::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 215, 0, 0.9);
    }
    
    /* Quiz specific styles */
    #quiz, #result { 
      opacity: 0; 
      transition: opacity 0.5s ease; 
      display: none;
    }
    #quiz.show, #result.show { 
      opacity: 1; 
      display: block;
    }
    
    .question-counter {
      text-align: center;
      font-weight: 600;
      margin-bottom: 8px;
      opacity: 0.9;
    }
    
    .question { font-family: 'Fredoka One', cursive; font-size: 1.15rem; margin: 10px 0; }
    .scripture { font-style: italic; opacity: 0.85; margin-bottom: 8px; }
    
    .progress-bar { width: 100%; height: 12px; background: #ddd; border-radius: 999px; overflow: hidden; margin: 14px 0; }
    .progress { height: 100%; width: 0%; background: var(--btn-bg); transition: width .35s ease; }
    
    .result { margin-top: 12px; }
    .department { margin: 10px 0; font-family: 'Fredoka One', cursive; font-size: 1.08rem; opacity: 0; transform: translateY(10px); transition: all .6s ease; }
    .department.show { opacity: 1; transform: none; }
    
    .scripture-box {
      margin-top: 8px;
      padding: 12px;
      border-left: 5px solid var(--btn-bg);
      background: rgba(255,215,0,0.08);
      border-radius: 8px;
      text-align: left;
      font-style: italic;
      display: none;
    }
    
    .scripture-box.visible { display: block; }
    
    .toggle-mode {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: 2px solid var(--btn-bg);
      color: var(--btn-bg);
      padding: 6px 10px;
      border-radius: 18px;
      cursor: pointer;
    }
    
.voice-btn {
    background: transparent;
    border: none;
    color: var(--btn-bg);
    font-size: 1.2rem;
    cursor: pointer;
    margin-left: 8px;
    vertical-align: middle;
}

.voice-btn:hover {
    transform: scale(1.1);
}

.question-container {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 10px 0;
}


    .back-btn {
      background: transparent;
      color: var(--btn-bg);
      border: 2px solid var(--btn-bg);
      padding: 8px 14px;
      border-radius: 28px;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      display: inline-block;
    }
    
    /* Explore list styles */
    .explore-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .explore-item {
      background: rgba(255,255,255,0.06);
      padding: 12px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-weight: 700;
    }
    .explore-item .title { flex: 1; text-align: left; font-weight: 700; }
    .explore-details { display: none; padding: 10px 12px; margin-top: 8px; background: rgba(0,0,0,0.15); border-radius: 6px; text-align: left; font-style: normal; color: var(--text-color); }
    .explore-details.visible { display: block; }
    
    /* Background slideshow */
    .bg-slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    
    .bg-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      background-size: cover;
      background-position: center;
    }
    
    .bg-slide.active {
      opacity: 1;
    }
  </style>
</head>

function sendToGoogleSheets(data) {
  console.log('Sending to Google Sheets:', data);
  
  // Convert department names to English before sending

    // Map department names to English (without scores)
    topDepartments: data.topDepartments.map(dept => convertToEnglish(dept)),
    // Store the selected language
    originalLanguage: data.language,
    timestamp: new Date().toISOString()
  };

  fetch(SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(englishData)
  })
  .then(response => {
    console.log('Response status:', response.status);
    if (response.ok || response.type === 'opaque') {
      console.log('Data successfully sent to Google Sheets');
    } else {
      console.error('Failed to send data to Google Sheets');
    }
  })
  .catch(error => {
    console.error('Error sending to Google Sheets:', error);
  });
}

// Speech synthesis functions
function speakText(text, langCode) {
    if ('speechSynthesis' in window) {
        // Cancel any ongoing speech
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = speechSynthesis.getVoices();
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        
        // Set language based on device capabilities
        utterance.lang = getOptimalLanguageCode(langCode, isMobile);
        
        let selectedVoice = findBestVoice(voices, langCode, isMobile);
        
        if (selectedVoice) {
            utterance.voice = selectedVoice;
            console.log('Using voice:', selectedVoice.name, 'for language:', langCode);
        } else {
            console.log('No optimal voice found, using default for:', langCode);
        }
        
        // Optimize speech parameters for mobile
        utterance.rate = isMobile ? 0.95 : 1.0;
        utterance.pitch = isMobile ? 1.05 : 1.0;
        utterance.volume = 1.0;
        
        // Add error handling
        utterance.onerror = function(event) {
            console.error('Speech synthesis error:', event.error);
            // Fallback to audio files if available
            playAudioFallback(langCode, text);
        };
        
        utterance.onend = function() {
            console.log('Speech finished');
        };
        
        window.speechSynthesis.speak(utterance);
    } else {
        console.log('Speech Synthesis not supported');
        playAudioFallback(langCode, text);
    }
}

function findBestVoice(voices, langCode, isMobile) {
    // Voice selection priorities for different languages
    const voicePreferences = {
        'de': [
            // German voices (priority order)
            { pattern: /de-DE/, quality: 10 },
            { pattern: /de-AT/, quality: 9 },
            { pattern: /de-CH/, quality: 8 },
            // Fallback to high-quality English voices for mobile
            { pattern: /en-GB/, quality: isMobile ? 7 : 0 },
            { pattern: /en-US/, quality: isMobile ? 6 : 0 }
        ],
        'tw': [
            // African/English voices for Twi
            { pattern: /en-GH/, quality: 10 },
            { pattern: /en-NG/, quality: 9 },
            { pattern: /en-ZA/, quality: 8 },
            { pattern: /en-GB/, quality: 7 },
            { pattern: /en-US/, quality: 6 }
        ],
        'gd': [
            // UK/Scottish voices
            { pattern: /en-GB/, quality: 10 },
            { pattern: /gd/, quality: 9 }, // Scottish Gaelic if available
            { pattern: /en-US/, quality: 5 }
        ],
        'en': [
            { pattern: /en-GB/, quality: 10 },
            { pattern: /en-US/, quality: 9 },
            { pattern: /en-AU/, quality: 8 }
        ],
        'fr': [
            { pattern: /fr-FR/, quality: 10 },
            { pattern: /fr-CA/, quality: 9 }
        ],
        'es': [
            { pattern: /es-ES/, quality: 10 },
            { pattern: /es-MX/, quality: 9 }
        ],
        'sv': [
            { pattern: /sv-SE/, quality: 10 }
        ]
    };

    const preferences = voicePreferences[langCode] || [{ pattern: /en-GB/, quality: 5 }];
    
    // Score each voice
    const scoredVoices = voices.map(voice => {
        let score = 0;
        let bestMatchQuality = 0;
        
        for (const pref of preferences) {
            if (pref.pattern.test(voice.lang)) {
                score = pref.quality;
                bestMatchQuality = Math.max(bestMatchQuality, pref.quality);
                break;
            }
        }
        
        // Bonus points for non-robotic voices
        if (!voice.name.includes('Robot') && !voice.name.includes('Samantha') && !voice.name.includes('Alex')) {
            score += 2;
        }
        
        // Bonus for local voices
        if (voice.localService) {
            score += 1;
        }
        
        return { voice, score, bestMatchQuality };
    });

    // Sort by score (highest first), then by best match quality
    scoredVoices.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return b.bestMatchQuality - a.bestMatchQuality;
    });

    return scoredVoices.length > 0 ? scoredVoices[0].voice : null;
}

function getOptimalLanguageCode(langCode, isMobile) {
    const languageMap = {
        'en': 'en-GB',
        'fr': 'fr-FR', 
        'es': 'es-ES',
        'de': 'de-DE',
        'tw': isMobile ? 'en-GB' : 'en-GH', // Use UK English for mobile, Ghana English for desktop
        'sv': 'sv-SE',
        'gd': 'en-GB'  // Use UK English for Scottish Gaelic
    };
    return languageMap[langCode] || 'en-GB';
}
